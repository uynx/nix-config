# repeated_keys fires on every dendritic module, because keeping
# flake.nixosModules.x, flake.homeModules.x and flake.wrappers.x as separate
# assignments is the point of the layout. Without this the other 20-odd lints
# are buried and nobody runs statix at all.
disabled = ["repeated_keys"]
ignore = [".direnv", "flake.lock"]
