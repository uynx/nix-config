[shell]
font_family = "Noto Sans"
time_format = "%I:%M %p"
date_format = "%A, %B %d"

[shell.screen_corners]
enabled = true
size = 18

[theme]
mode = "dark"
source = "custom"
custom_palette = "Flexoki"

[wallpaper]
enabled = true

[wallpaper.default]
path = "/home/uynx/nix-config/modules/wallpapers/wallpaper.png"

[hooks]
session_unlocked = "loginctl unlock-session"

[idle]
pre_action_fade_seconds = 5

[idle.behavior.screen-off]
timeout = 180
action = "screen_off"
enabled = true

[idle.behavior.lock]
timeout = 240
action = "lock"
enabled = true

[lockscreen]
blur_intensity = 0.7
tint_intensity = 0.45
transition = ["fade"]
transition_duration = 600

[location]
auto_locate = false
address = "Amherst, MA"
latitude = 42.36723
longitude = -72.51852

[weather]
enabled = true
effects = true
refresh_minutes = 30
unit = "imperial"

# placement 100×100 makes cx/cy percent of the screen; noctalia rescales them to each output.
[lockscreen_widgets]
enabled = true

[lockscreen_widgets.widget.lock-icon]
type = "button"
cx = 50.0
cy = 27.0
placement_width = 100.0
placement_height = 100.0
box_width = 56.0
box_height = 56.0

[lockscreen_widgets.widget.lock-icon.settings]
glyph = "lock"
background = false
color = "primary"

[lockscreen_widgets.widget.lock-clock]
type = "clock"
cx = 50.0
cy = 40.0
placement_width = 100.0
placement_height = 100.0
box_width = 440.0
box_height = 120.0

[lockscreen_widgets.widget.lock-clock.settings]
format = "{:%I:%M %p}"
center_text = true
background = false
color = "on_surface"

[lockscreen_widgets.widget.lock-date]
type = "clock"
cx = 50.0
cy = 50.0
placement_width = 100.0
placement_height = 100.0
box_width = 360.0
box_height = 36.0

[lockscreen_widgets.widget.lock-date.settings]
format = "{:%A, %B %d}"
center_text = true
background = false
color = "on_surface_variant"

[lockscreen_widgets.widget.lock-media]
type = "media_player"
cx = 50.0
cy = 81.0
placement_width = 100.0
placement_height = 100.0

[lockscreen_widgets.widget.lock-media.settings]
hide_when_no_media = true
album_art_background = true
audio_visualizer = true
background_opacity = 0.6

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
type = "login_box"
output = "eDP-1"
cx = 50.0
cy = 64.0
placement_width = 100.0
placement_height = 100.0

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
layout = "compact"
show_unlock_hint = false
show_session_buttons = false
show_media = false
show_weather = false
show_keyboard_layout = false
show_login_button = false
show_password_reveal = false
center_password_text = true
background_opacity = 0.0
input_opacity = 0.55
input_radius = 22.0

[bar.main]
position = "top"
background_opacity = 0.0
capsule = true
margin_edge = 4
margin_ends = 4
padding = 10
radius = 12
thickness = 32
capsule_thickness = 0.82
scale = 0.9
capsule_opacity = 0.49
widget_spacing = 8

start  = ["launcher", "clock", "group:system", "active_window"]
center = ["workspaces"]
end    = ["group:media", "tray", "notifications", "battery", "volume", "brightness", "osk", "control-center"]

[widget.workspaces]
type = "workspaces"
focused_color = "tertiary"
occupied_color = "secondary"

[[bar.main.capsule_group]]
id = "media"
members = ["media", "visualizer"]
opacity = 0.49

[[bar.main.capsule_group]]
id = "system"
members = ["cpu", "ram", "disk"]
opacity = 0.49

[widget.disk]
type = "sysmon"
stat = "disk_used_pct"
path = "/"

[widget.visualizer]
type = "audio_visualizer"
width = 40
bands = 12
mirrored = false
centered = false

[widget.osk]
type = "custom_button"
glyph = "keyboard"
tooltip = "On-screen keyboard"

[widget.osk.actions]
left = "exec pkill -x wvkbd-mobintl || wvkbd-mobintl -l fullwide --landscape-layers fullwide -L 250"

[widget.control-center]
glyph = "adjustments-alt"

[widget.clock]
type = "clock"
format = "{:%I:%M %p %a, %b %d}"
