[[bar.main.capsule_group]]
id = "system"
members = ["cpu", "cpu-temp", "ram", "gpu", "gpu-temp", "vram", "disk", "net-down", "net-up"]
opacity = 0.49

[widget.cpu-temp]
type = "sysmon"
stat = "cpu_temp"

[widget.gpu]
type = "sysmon"
stat = "gpu_usage"

[widget.gpu-temp]
type = "sysmon"
stat = "gpu_temp"

[widget.vram]
type = "sysmon"
stat = "gpu_vram_used"

[widget.net-down]
type = "sysmon"
stat = "net_rx"
network_speed_compact = true

[widget.net-up]
type = "sysmon"
stat = "net_tx"
network_speed_compact = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
type = "login_box"
output = "DP-3"
cx = 50.0
cy = 64.0
placement_width = 100.0
placement_height = 100.0

[lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
layout = "compact"
show_unlock_hint = false
show_session_buttons = false
show_media = false
show_weather = false
show_keyboard_layout = false
show_login_button = false
show_password_reveal = false
center_password_text = true
background_opacity = 0.0
input_opacity = 0.55
input_radius = 22.0
